<div id="hc-root" class="hc-root"></div>
<script>
  (function () {
    "use strict";
    var INLINE_ROWS = 6;

    function visibilityBadge(event) {
      if (event.registration_closed) return HC.badge("Registration closed", "warning");
      if (event.visibility === "public") return HC.badge("Public", "success");
      return HC.badge("Private");
    }

    function row(event) {
      var meta = [HC.fmtDate(event.event_date), event.event_type].filter(Boolean).join(" · ");
      return HC.el("div", { class: "hc-row" }, [
        HC.el("div", { class: "hc-row-main" }, [
          HC.el("div", { class: "hc-row-name", text: event.name || "Untitled event" }),
          HC.el("div", { class: "hc-row-meta", text: meta || "No date set" }),
        ]),
        visibilityBadge(event),
      ]);
    }

    HC.mount(function (data, ctx) {
      var events = Array.isArray(data.events) ? data.events : [];
      var total = typeof data.total === "number" ? data.total : events.length;
      var expanded = ctx.displayMode === "fullscreen" || ctx.widgetState.expanded === true;
      var shown = expanded ? events : events.slice(0, INLINE_ROWS);

      var card = HC.el("div", { class: "hc-card" }, [
        HC.el("div", { class: "hc-head" }, [
          HC.el("h2", { class: "hc-title", text: total === 1 ? "1 event" : HC.num(total) + " events" }),
          data.search
            ? HC.el("p", { class: "hc-sub", text: 'matching "' + data.search + '"' })
            : null,
        ]),
      ]);

      if (!events.length) {
        card.appendChild(HC.el("p", { class: "hc-empty", text: "No events match this search." }));
        return card;
      }

      shown.forEach(function (event) {
        card.appendChild(row(event));
      });

      var actions = HC.el("div", { class: "hc-actions" }, []);
      if (!expanded && events.length > INLINE_ROWS) {
        actions.appendChild(
          HC.el("button", {
            class: "hc-btn",
            type: "button",
            text: "View all " + HC.num(events.length),
            onClick: function () {
              HC.setState({ expanded: true });
              HC.requestFullscreen();
            },
          })
        );
      }
      var first = shown[0];
      if (first && first.name) {
        actions.appendChild(
          HC.askButton("Event summary", 'Show me the full details and stats for the event "' + first.name + '".', "primary")
        );
      }
      if (actions.childNodes.length) card.appendChild(actions);
      return card;
    });
  })();
</script>
