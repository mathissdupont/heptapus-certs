<div id="hc-root" class="hc-root"></div>
<script>
  (function () {
    "use strict";
    var INLINE_ROWS = 8;

    function statusTone(status) {
      if (status === "revoked") return "danger";
      if (status === "expired") return "warning";
      return "success";
    }

    function row(cert) {
      var meta = [HC.fmtDate(cert.issued_at), cert.public_id].filter(Boolean).join(" · ");
      return HC.el("div", { class: "hc-row" }, [
        HC.el("div", { class: "hc-row-main" }, [
          HC.el("div", { class: "hc-row-name", text: cert.recipient_name || "Unnamed recipient" }),
          HC.el("div", { class: "hc-row-meta", text: meta }),
        ]),
        HC.badge(cert.status || "active", statusTone(cert.status)),
      ]);
    }

    HC.mount(function (data, ctx) {
      var certs = Array.isArray(data.certificates) ? data.certificates : [];
      var total = typeof data.total === "number" ? data.total : certs.length;
      var expanded = ctx.displayMode === "fullscreen" || ctx.widgetState.expanded === true;
      var shown = expanded ? certs : certs.slice(0, INLINE_ROWS);

      var card = HC.el("div", { class: "hc-card" }, [
        HC.el("div", { class: "hc-head" }, [
          HC.el("h2", {
            class: "hc-title",
            text: total === 1 ? "1 certificate" : HC.num(total) + " certificates",
          }),
        ]),
      ]);

      if (!certs.length) {
        card.appendChild(
          HC.el("p", { class: "hc-empty", text: "No certificates have been issued yet." })
        );
        return card;
      }

      shown.forEach(function (cert) {
        card.appendChild(row(cert));
      });

      var actions = HC.el("div", { class: "hc-actions" }, []);
      if (!expanded && certs.length > INLINE_ROWS) {
        actions.appendChild(
          HC.el("button", {
            class: "hc-btn",
            type: "button",
            text: "View all " + HC.num(certs.length),
            onClick: function () {
              HC.setState({ expanded: true });
              HC.requestFullscreen();
            },
          })
        );
      }
      if (actions.childNodes.length) card.appendChild(actions);
      return card;
    });
  })();
</script>
