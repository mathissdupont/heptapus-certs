name: CI - Tests & Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: heptacert/backend

    env:
      DATABASE_URL: sqlite+aiosqlite:///
      JWT_SECRET: ci-test-jwt-secret-32chars-minimum!!
      EMAIL_TOKEN_SECRET: ci-test-email-token-secret-padded
      BOOTSTRAP_SUPERADMIN_EMAIL: super@test.com
      BOOTSTRAP_SUPERADMIN_PASSWORD: SuperPass123!
      PUBLIC_BASE_URL: http://localhost:8000
      FRONTEND_BASE_URL: http://localhost:3000
      CORS_ORIGINS: "*"
      STORAGE_MODE: local
      LOCAL_STORAGE_DIR: /tmp/heptacert_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: heptacert/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Verify CLI package
        run: |
          pip install ../cli
          hc --help

      - name: Run all tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=40

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: heptacert/backend/coverage.xml

      - name: Check for security issues (bandit)
        run: |
          pip install bandit
          bandit -r src/ -ll -ii --skip B101,B106

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: heptacert/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: heptacert/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000/api
          NODE_ENV: production

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  docs-build:
    name: Documentation Build & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: heptacert/docs

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: heptacert/docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Check documentation links and public URL contracts
        run: npm run check:links

      - name: Production build
        run: npm run build
